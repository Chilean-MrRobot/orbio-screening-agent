# Calentamiento de candidatos. Los tiempos cuentan desde que empieza el silencio.
# Fuera de la ventana de 24 h, WhatsApp solo permite plantillas aprobadas por Meta.

business_hours:            # no se envían toques fuera de este horario (hora local)
  ES:
    timezone: Europe/Madrid
    days: [1, 2, 3, 4, 5, 6]   # lunes a sábado
    start_hour: 9
    end_hour: 21
  MX:
    timezone: America/Mexico_City
    days: [1, 2, 3, 4, 5, 6]
    start_hour: 9
    end_hour: 21

queue_outside_hours: true            # si cae fuera de horario, se envía al abrir la ventana
on_candidate_reply: cancel_pending   # si responde, se cancelan los toques pendientes
on_new_silence: restart_from_current_stage

cadences:
  - name: never_responded
    trigger: never_responded
    steps:
      - {name: first_contact, after_hours: 0, channel: whatsapp, template: first_contact}
      - {name: reminder_whatsapp, after_hours: 24, channel: whatsapp, template: reminder_never_responded}
      - {name: reminder_sms, after_hours: 72, channel: sms, template: reminder_sms}
      - {name: closing, after_hours: 120, channel: whatsapp, template: closing_no_response, closes: true}

  - name: abandoned_mid_screening
    trigger: abandoned_mid_screening
    steps:
      - {name: resume_whatsapp, after_hours: 24, channel: whatsapp, template: reminder_abandoned}
      - {name: resume_sms, after_hours: 72, channel: sms, template: reminder_abandoned_sms}
      - {name: closing, after_hours: 120, channel: whatsapp, template: closing_no_response, closes: true}
