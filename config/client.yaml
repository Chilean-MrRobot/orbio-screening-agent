client:
  name: Grupo Sazón
  agent_name: Sofía
  recruiter_sla_hours: 48   # "un reclutador te contactará en las próximas 48 h"

# Modelos de OpenAI. Cambiarlos aquí no requiere tocar código.
llm:
  conversation_model: gpt-5-mini
  extraction_model: gpt-5-mini
  classifier_model: gpt-5-nano     # clasificador de emoción: modelo chico y rápido
  judge_model: gpt-5-mini          # LLM-as-a-judge de las evaluaciones
  embedding_model: text-embedding-3-small
  extraction_temperature: null     # los modelos de razonamiento no aceptan temperature
  # Esfuerzo de razonamiento (minimal | low | medium | high), medido con las evals:
  # minimal baja la latencia a ~2 s por llamada sin perder calidad en respuesta, resumen,
  # emoción ni RAG; la extracción necesita low (correcciones, confirmación, "mi coche").
  reasoning_effort: minimal
  extraction_reasoning_effort: low
