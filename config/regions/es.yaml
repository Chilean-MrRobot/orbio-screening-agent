    - name: Madrid
    - name: Barcelona
    - name: Valencia
    - name: Sevilla
    - name: Málaga
      aliases: [Malaga]
    - name: Bilbao
    - name: Zaragoza

  # Tabla simplificada para el demo: qué permiso habilita cada vehículo de reparto.
  licenses:
    AM:
      vehicles: [motorcycle]   # ciclomotor hasta 50 cc
    A1:
      vehicles: [motorcycle]
    A2:
      vehicles: [motorcycle]
    A:
      vehicles: [motorcycle]
    B:
      vehicles: [car, motorcycle]
      min_years:
        motorcycle: 3          # el B habilita motos de 125 cc con 3 años de antigüedad
