[project]
name = "orbio-screening-agent"
version = "0.1.0"
description = "Agente de screening de candidatos para Grupo Sazón (assignment FDE Orbio)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "phonenumbers>=8.13",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "openai>=1.50",
    "langsmith>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/screening"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not eval'"
markers = [
    "eval: evaluaciones contra el golden dataset (llaman al LLM, se corren a pedido)",
    "integration: tests que usan servicios externos (se saltan sin credenciales)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
